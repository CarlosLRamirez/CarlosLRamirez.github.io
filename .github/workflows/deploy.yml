name: Deploy Multi-Site to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Solo un deploy a la vez
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # ===== Build Landing + Portfolio (Astro) =====
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: landing-source/package-lock.json

      - name: Build Landing with Astro
        run: |
          cd landing-source
          npm ci
          npm run build
          mkdir -p ../public
          cp -r dist/. ../public/

      # ===== Build Blog (Hugo) =====
      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: 'latest'
          extended: true

      - name: Build Blog with Hugo
        run: |
          cd blog
          hugo --minify --baseURL "https://carloslramirez.com/blog/"
          mkdir -p ../public/blog
          cp -r public/* ../public/blog/

      # ===== Copy CNAME + disable Jekyll processing =====
      - name: Copy CNAME and add .nojekyll
        run: |
          cp CNAME public/
          touch public/.nojekyll

      # ===== Deploy =====
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
