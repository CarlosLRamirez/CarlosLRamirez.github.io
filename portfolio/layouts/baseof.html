<!DOCTYPE html>
<html lang="{{ site.Language.Lang | default "en" }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ if .IsHome }}{{ site.Title }}{{ else }}{{ .Title }} | Portfolio{{ end }}</title>
  <meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ with .Params.summary }}{{ . }}{{ else }}{{ site.Params.description }}{{ end }}{{ end }}">
  <link rel="canonical" href="{{ .Permalink }}">

  <meta property="og:type" content="{{ if .IsPage }}article{{ else }}website{{ end }}">
  <meta property="og:title" content="{{ if .IsHome }}{{ site.Title }}{{ else }}{{ .Title }}{{ end }}">
  <meta property="og:description" content="{{ with .Description }}{{ . }}{{ else }}{{ with .Params.summary }}{{ . }}{{ else }}{{ site.Params.description }}{{ end }}{{ end }}">
  <meta property="og:url" content="{{ .Permalink }}">
  {{ with .Resources.GetMatch "cover.*" }}<meta property="og:image" content="{{ .Permalink }}">{{ end }}

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

  {{ with resources.Get "css/main.css" }}
    {{ $css := . | minify | fingerprint }}
    <link rel="stylesheet" href="{{ $css.RelPermalink }}" integrity="{{ $css.Data.Integrity }}">
  {{ end }}
</head>
<body>
  <header class="site-header">
    <div class="container">
      <nav>
        <a class="home" href="{{ site.Params.landingURL }}">Carlos Ramirez</a>
        <a href="{{ site.Home.RelPermalink }}">Portfolio</a>
        <a href="{{ site.Params.blogURL }}">Blog</a>
      </nav>
    </div>
  </header>

  <main>
    {{ block "main" . }}{{ end }}
  </main>

  <footer class="site-footer">
    <div class="container">
      <a href="{{ site.Params.landingURL }}">Home</a>
      <a href="{{ site.Params.blogURL }}">Blog</a>
      <a href="https://linkedin.com/in/carloslrm" target="_blank" rel="noopener">LinkedIn</a>
      <a href="https://github.com/CarlosLRamirez" target="_blank" rel="noopener">GitHub</a>
      <a href="mailto:carloslrm@gmail.com">Email</a>
    </div>
  </footer>
</body>
</html>
